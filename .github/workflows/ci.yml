name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run isolated quality and acceptance suite
        run: >-
          docker compose --profile test up --build
          --abort-on-container-exit --exit-code-from test-runner test-runner
      - name: Show service logs after failure
        if: failure()
        run: docker compose --profile test logs --no-color
      - name: Remove test infrastructure
        if: always()
        run: docker compose --profile test down --volumes --remove-orphans
