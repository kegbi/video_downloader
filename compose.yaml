name: video-downloader

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "2"

x-app-common: &app-common
  build:
    context: .
    target: app
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:size=16m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging: *default-logging
  networks:
    - internal

x-base-environment: &base-environment
  APP_ENV: ${APP_ENV:-development}
  APP_LOG_LEVEL: ${APP_LOG_LEVEL:-info}
  TZ: ${APP_TIMEZONE:-UTC}
  METRICS_ENABLED: "${METRICS_ENABLED:-true}"
  METRICS_PATH: ${METRICS_PATH:-/metrics}
  LOKI_PUSH_URL: ${LOKI_PUSH_URL:-http://loki:3100/loki/api/v1/push}
  TELEGRAM_ACCESS_NOTIFICATION_LEASE_SECONDS: ${TELEGRAM_ACCESS_NOTIFICATION_LEASE_SECONDS:-30}
  TELEGRAM_ACCESS_NOTIFICATION_POLL_INTERVAL_MS: ${TELEGRAM_ACCESS_NOTIFICATION_POLL_INTERVAL_MS:-1000}
  TELEGRAM_ACCESS_NOTIFICATION_MAX_ATTEMPTS: ${TELEGRAM_ACCESS_NOTIFICATION_MAX_ATTEMPTS:-8}
  TELEGRAM_ADMIN_PROMPT_TTL_SECONDS: ${TELEGRAM_ADMIN_PROMPT_TTL_SECONDS:-300}
  ACCESS_REQUEST_DENIED_COOLDOWN_SECONDS: ${ACCESS_REQUEST_DENIED_COOLDOWN_SECONDS:-604800}

x-database-environment: &database-environment
  POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
  POSTGRES_DB: ${POSTGRES_DB:-video_downloader}
  POSTGRES_USER: ${POSTGRES_USER:-video_downloader}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-postgres-password}
  POSTGRES_POOL_SIZE: "${POSTGRES_POOL_SIZE:-10}"
  POSTGRES_SSL_MODE: ${POSTGRES_SSL_MODE:-disable}

x-rabbit-environment: &rabbit-environment
  RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
  RABBITMQ_USER: ${RABBITMQ_USER:-video_downloader}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-local-rabbitmq-password}
  RABBITMQ_VHOST: ${RABBITMQ_VHOST:-video_downloader}
  RABBITMQ_TLS: "${RABBITMQ_TLS:-false}"
  RABBITMQ_DOWNLOAD_QUEUE: ${RABBITMQ_DOWNLOAD_QUEUE:-video.download}
  RABBITMQ_DOWNLOAD_RETRY_QUEUE: ${RABBITMQ_DOWNLOAD_RETRY_QUEUE:-video.download.retry}
  RABBITMQ_DOWNLOAD_DEAD_LETTER_QUEUE: ${RABBITMQ_DOWNLOAD_DEAD_LETTER_QUEUE:-video.download.dead}

x-storage-environment: &storage-environment
  S3_ENDPOINT: ${S3_ENDPOINT:-http://rustfs:9000}
  S3_BUCKET: ${S3_BUCKET:-video-artifacts}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-local-rustfs-access-key}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-local-rustfs-secret-key}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_FORCE_PATH_STYLE: "${S3_FORCE_PATH_STYLE:-true}"
  S3_TEMP_PREFIX: ${S3_TEMP_PREFIX:-temporary/}
  S3_ARTIFACT_PREFIX: ${S3_ARTIFACT_PREFIX:-artifacts/}

services:
  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-video_downloader}
      POSTGRES_USER: ${POSTGRES_USER:-video_downloader}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-postgres-password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    networks: [internal]
    logging: *default-logging

  rabbitmq:
    image: rabbitmq:4.3.1-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-video_downloader}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-local-rabbitmq-password}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-video_downloader}
      RABBITMQ_CTL_ERL_ARGS: "+S 1:1"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "-t", "10", "ping"]
      interval: 30s
      timeout: 15s
      retries: 5
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks: [internal]
    logging: *default-logging

  rustfs:
    image: rustfs/rustfs:1.0.0-beta.10
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-local-rustfs-access-key}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-local-rustfs-secret-key}
      RUSTFS_CONSOLE_ENABLE: "${RUSTFS_CONSOLE_ENABLE:-true}"
      RUSTFS_VOLUMES: /data
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -fsS http://localhost:9000/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - rustfs-data:/data
    ports:
      - "127.0.0.1:${RUSTFS_PORT:-9000}:9000"
    networks: [internal]
    logging: *default-logging

  loki:
    image: grafana/loki:3.7.6
    restart: unless-stopped
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./tools/observability/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:${LOKI_PORT:-3100}:3100"
    healthcheck:
      test: ["CMD", "/usr/bin/loki", "-version"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [internal]
    logging: *default-logging
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }

  prometheus:
    image: prom/prometheus:v3.13.2
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
    volumes:
      - ./tools/observability/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "/bin/prometheus", "--version"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [internal]
    logging: *default-logging
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 384M }

  rustfs-init:
    <<: *app-common
    restart: "no"
    command: ["deno", "task", "storage:init"]
    environment:
      <<: [*base-environment, *storage-environment]
    depends_on:
      rustfs:
        condition: service_healthy

  migrate:
    <<: *app-common
    restart: "no"
    command: ["deno", "task", "migrate"]
    environment:
      <<: [*base-environment, *database-environment]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app-common
    command: ["deno", "task", "api"]
    environment:
      <<: [*base-environment, *database-environment, *storage-environment]
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-local-internal-token-change-before-production}
      API_HOST: ${API_HOST:-0.0.0.0}
      TELEGRAM_ADMIN_USER_IDS: ${TELEGRAM_ADMIN_USER_IDS:-}
      RETENTION_DEFAULT_MODE: ${RETENTION_DEFAULT_MODE:-ttl}
      RETENTION_TTL_SECONDS: "${RETENTION_TTL_SECONDS:-604800}"
      RETENTION_AFTER_DELIVERY_GRACE_SECONDS: "${RETENTION_AFTER_DELIVERY_GRACE_SECONDS:-300}"
      ACCESS_REQUEST_TTL_SECONDS: "${ACCESS_REQUEST_TTL_SECONDS:-604800}"
      MAX_ACTIVE_JOBS_PER_USER: "${MAX_ACTIVE_JOBS_PER_USER:-2}"
      MAX_QUEUED_JOBS: "${MAX_QUEUED_JOBS:-100}"
      SOURCE_ALLOWED_HOSTS: ${SOURCE_ALLOWED_HOSTS:-x.com,www.x.com,twitter.com,www.twitter.com}
    depends_on:
      migrate:
        condition: service_completed_successfully
      rustfs-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    healthcheck:
      test: [
        "CMD",
        "deno",
        "eval",
        "const r=await fetch('http://127.0.0.1:8080/health/ready');if(!r.ok)Deno.exit(1)",
      ]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 256M }

  worker:
    <<: *app-common
    build:
      context: .
      target: worker
    command: ["deno", "task", "worker"]
    environment:
      <<: [*base-environment, *database-environment, *rabbit-environment, *storage-environment]
      DOWNLOAD_TEMP_DIR: ${DOWNLOAD_TEMP_DIR:-/var/tmp/video-downloader}
      STORAGE_MAX_BYTES: ${STORAGE_MAX_BYTES:-0}
      WORKER_CONCURRENCY: "${WORKER_CONCURRENCY:-2}"
      WORKER_JOB_LEASE_SECONDS: "${WORKER_JOB_LEASE_SECONDS:-120}"
      WORKER_HEARTBEAT_SECONDS: "${WORKER_HEARTBEAT_SECONDS:-30}"
      WORKER_MAX_ATTEMPTS: "${WORKER_MAX_ATTEMPTS:-3}"
      WORKER_SOURCE_TIMEOUT_RETRY_DELAY_SECONDS: "${WORKER_SOURCE_TIMEOUT_RETRY_DELAY_SECONDS:-5}"
      WORKER_RETRY_DELAY_SECONDS: "${WORKER_RETRY_DELAY_SECONDS:-30}"
      YTDLP_PATH: ${YTDLP_PATH:-yt-dlp}
      FFMPEG_PATH: ${FFMPEG_PATH:-ffmpeg}
      FFPROBE_PATH: ${FFPROBE_PATH:-ffprobe}
      DOWNLOAD_TIMEOUT_SECONDS: "${DOWNLOAD_TIMEOUT_SECONDS:-900}"
      DOWNLOAD_MAX_DURATION_SECONDS: "${DOWNLOAD_MAX_DURATION_SECONDS:-1800}"
      DOWNLOAD_MAX_HEIGHT: "${DOWNLOAD_MAX_HEIGHT:-1080}"
      DOWNLOAD_FORMAT_SAFETY_BYTES: "${DOWNLOAD_FORMAT_SAFETY_BYTES:-2000000}"
      MAX_ARTIFACT_BYTES: "${MAX_ARTIFACT_BYTES:-49000000}"
      DOWNLOAD_MAX_TEMP_BYTES: "${DOWNLOAD_MAX_TEMP_BYTES:-200000000}"
      TELEGRAM_MAX_UPLOAD_BYTES: "${TELEGRAM_MAX_UPLOAD_BYTES:-49000000}"
      DOWNLOADER_MODE: ${DOWNLOADER_MODE:-live}
    volumes:
      - worker-temp:/var/tmp/video-downloader
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
    healthcheck:
      test: [
        "CMD",
        "deno",
        "eval",
        "const r=await fetch('http://127.0.0.1:8081/health/ready');if(!r.ok)Deno.exit(1)",
      ]
      interval: 10s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 768M }

  maintenance:
    <<: *app-common
    command: ["deno", "task", "maintenance"]
    environment:
      <<: [*base-environment, *database-environment, *rabbit-environment, *storage-environment]
      OUTBOX_POLL_INTERVAL_MS: "${OUTBOX_POLL_INTERVAL_MS:-250}"
      CLEANUP_INTERVAL_SECONDS: "${CLEANUP_INTERVAL_SECONDS:-60}"
      TEMP_OBJECT_MAX_AGE_SECONDS: "${TEMP_OBJECT_MAX_AGE_SECONDS:-86400}"
      JOB_HISTORY_TTL_SECONDS: "${JOB_HISTORY_TTL_SECONDS:-604800}"
      ACCESS_REQUEST_TTL_SECONDS: "${ACCESS_REQUEST_TTL_SECONDS:-604800}"
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
    healthcheck:
      test: [
        "CMD",
        "deno",
        "eval",
        "const r=await fetch('http://127.0.0.1:8083/health/ready');if(!r.ok)Deno.exit(1)",
      ]
      interval: 10s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 192M }

  telegram-bridge:
    <<: *app-common
    profiles: ["live"]
    command: ["deno", "task", "telegram"]
    environment:
      <<: *base-environment
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-local-internal-token-change-before-production}
      API_BASE_URL: ${API_BASE_URL:-http://api:8080}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ADMIN_USER_IDS: ${TELEGRAM_ADMIN_USER_IDS:-}
      TELEGRAM_MODE: ${TELEGRAM_MODE:-polling}
      TELEGRAM_BOT_API_ROOT: ${TELEGRAM_BOT_API_ROOT:-https://api.telegram.org}
      TELEGRAM_MAX_UPLOAD_BYTES: "${TELEGRAM_MAX_UPLOAD_BYTES:-49000000}"
      TELEGRAM_PROGRESS_MIN_INTERVAL_SECONDS: "${TELEGRAM_PROGRESS_MIN_INTERVAL_SECONDS:-2}"
      TELEGRAM_DELIVERY_LEASE_SECONDS: "${TELEGRAM_DELIVERY_LEASE_SECONDS:-300}"
      TELEGRAM_DELIVERY_HEARTBEAT_SECONDS: "${TELEGRAM_DELIVERY_HEARTBEAT_SECONDS:-30}"
      TELEGRAM_DELIVERY_POLL_INTERVAL_MS: "${TELEGRAM_DELIVERY_POLL_INTERVAL_MS:-250}"
      ALLOW_PRIVATE_CHATS_ONLY: "${ALLOW_PRIVATE_CHATS_ONLY:-true}"
      SOURCE_ALLOWED_HOSTS: ${SOURCE_ALLOWED_HOSTS:-x.com,www.x.com,twitter.com,www.twitter.com}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [
        "CMD",
        "deno",
        "eval",
        "const r=await fetch('http://127.0.0.1:8082/health/ready');if(!r.ok)Deno.exit(1)",
      ]
      interval: 10s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 192M }

  postgres-test:
    image: postgres:17.6-alpine
    profiles: ["test"]
    environment:
      POSTGRES_DB: video_downloader_test
      POSTGRES_USER: video_downloader_test
      POSTGRES_PASSWORD: test-postgres-password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U video_downloader_test -d video_downloader_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs: [/var/lib/postgresql/data]
    networks: [internal]
    logging: *default-logging

  rabbitmq-test:
    image: rabbitmq:4.3.1-management-alpine
    profiles: ["test"]
    command:
      - /bin/sh
      - -c
      - >-
          install -o rabbitmq -g rabbitmq -m 600 /dev/null /var/lib/rabbitmq/.erlang.cookie &&
          printf '%s' "$${RABBITMQ_ERLANG_COOKIE}" > /var/lib/rabbitmq/.erlang.cookie &&
          chown -R rabbitmq:rabbitmq /var/lib/rabbitmq &&
          exec su-exec rabbitmq rabbitmq-server
    environment:
      RABBITMQ_DEFAULT_USER: video_downloader_test
      RABBITMQ_DEFAULT_PASS: test-rabbitmq-password
      RABBITMQ_DEFAULT_VHOST: video_downloader_test
      RABBITMQ_ERLANG_COOKIE: test-only-rabbitmq-cookie
      RABBITMQ_CTL_ERL_ARGS: "+S 1:1"
    tmpfs:
      - /var/lib/rabbitmq:size=128m,uid=100,gid=101,mode=0700
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "-t", "10", "ping"]
      interval: 2s
      timeout: 15s
      retries: 40
    networks: [internal]
    logging: *default-logging

  rustfs-test:
    image: rustfs/rustfs:1.0.0-beta.10
    profiles: ["test"]
    environment:
      RUSTFS_ACCESS_KEY: test-rustfs-access-key
      RUSTFS_SECRET_KEY: test-rustfs-secret-key
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_VOLUMES: /data
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -fsS http://localhost:9000/health >/dev/null"]
      interval: 2s
      timeout: 3s
      retries: 40
    tmpfs:
      - /data:uid=10001,gid=10001,mode=0700
    networks: [internal]
    logging: *default-logging

  rustfs-test-init:
    <<: *app-common
    profiles: ["test"]
    restart: "no"
    command: ["deno", "task", "storage:init"]
    environment:
      APP_ENV: test
      S3_ENDPOINT: http://rustfs-test:9000
      S3_BUCKET: video-artifacts-test
      S3_ACCESS_KEY: test-rustfs-access-key
      S3_SECRET_KEY: test-rustfs-secret-key
    depends_on:
      rustfs-test:
        condition: service_healthy

  test-runner:
    <<: *app-common
    profiles: ["test"]
    build:
      context: .
      target: test
    restart: "no"
    read_only: false
    command: ["deno", "task", "ci"]
    environment:
      APP_ENV: test
      TEST_POSTGRES_HOST: postgres-test
      TEST_POSTGRES_DB: video_downloader_test
      TEST_POSTGRES_USER: video_downloader_test
      TEST_POSTGRES_PASSWORD: test-postgres-password
      TEST_S3_ENDPOINT: http://rustfs-test:9000
      TEST_S3_BUCKET: video-artifacts-test
      TEST_S3_ACCESS_KEY: test-rustfs-access-key
      TEST_S3_SECRET_KEY: test-rustfs-secret-key
      TEST_RABBITMQ_HOST: rabbitmq-test
      TEST_RABBITMQ_USER: video_downloader_test
      TEST_RABBITMQ_PASSWORD: test-rabbitmq-password
      TEST_RABBITMQ_VHOST: video_downloader_test
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /var/tmp:size=256m,mode=1777
    depends_on:
      postgres-test:
        condition: service_healthy
      rabbitmq-test:
        condition: service_healthy
      rustfs-test-init:
        condition: service_completed_successfully

networks:
  internal:
    driver: bridge

volumes:
  postgres-data:
  rabbitmq-data:
  rustfs-data:
  loki-data:
  prometheus-data:
  worker-temp:
